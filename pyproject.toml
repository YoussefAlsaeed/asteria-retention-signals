[project]
name = "asteria-retention-signals"
version = "0.1.0"
description = "External labour-market signals x workforce retention: a reproducible data product."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Youssef Alsaeed", email = "yousefalsaeed2002@gmail.com" }]
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
asteria = "asteria.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asteria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["asteria"]
mypy_path = "src"
